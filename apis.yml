name: Publishizer
description: Publishizer is a book crowdfunding platform and literary agency that connects
  authors with readers and publishers. Authors create book proposals and run pre-order
  campaigns; readers pre-order copies to signal demand; and publishers use data such
  as pre-order volume and proposal quality to discover and acquire promising manuscripts.
  It was surfaced as a portfolio company of 500 Global and added to the API Evangelist
  network. As of this enrichment pass the company publishes a consumer web platform
  and blog but no public developer API, documentation, or developer portal.
